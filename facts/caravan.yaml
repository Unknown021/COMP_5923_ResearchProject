# Facts planted in the shared scenario transcript: 15 total, 5 per position band.
# target_relative_position is a fraction of the conversation's tokens (system prompt excluded).
# Rules:
#  - Answers are invented and unguessable; never genre defaults.
#  - Each answer string appears EXACTLY ONCE in the assembled transcript (validated), so
#    filler and other facts must never use them.
#  - Every fact is introduced the same way: a user turn states it, then one character gives
#    a short acknowledgement (name-prefixed) that does NOT repeat the answer.
#  - Aliases are other spellings that count as correct; each must be specific enough that
#    matching it means the fact was recalled.

facts:
  # ---- early ----
  - id: f01
    position_band: early
    target_relative_position: 0.06
    introducing_exchange:
      - role: user
        content: "The ferryman pockets my coins and grunts his name as he pushes off: Odrevan Pelk."
      - role: assistant
        content: "Brennic: *eyes the man's poling arm* \"Strong. Quiet. Good. Keep your hand off your purse anyway, eh, friend?\""
    probe_question: "Remind me, what was the name of the ferryman who took us across the Saltmere?"
    canonical_answer: "Odrevan Pelk"
    accepted_aliases: ["Odrevan", "Pelk"]

